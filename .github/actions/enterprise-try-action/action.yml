name: Enterprise Try status
description: >-
  Resolve a branch name to its try push on Treeherder and aggregate that push's
  job results into a verdict.

inputs:
  branch:
    description: Branch name to look for in the try repository.
    required: true
  try-remote:
    description: Try repository holding the pushes.
    default: https://github.com/mozilla/enterprise-firefox-try
  treeherder-url:
    description: Treeherder instance to query.
    default: https://treeherder.mozilla.org
  treeherder-project:
    description: Treeherder project (repository) name.
    default: enterprise-firefox-try
  max-tier:
    description: Highest tier whose failures are considered blocking.
    default: "2"
  wait-for-push:
    description: >-
      Seconds to keep retrying while Treeherder has not indexed the push yet.
    default: "0"
  poll-interval:
    description: Seconds between retries while waiting for the push.
    default: "30"

outputs:
  verdict:
    description: One of not-found, no-jobs, in-progress, success, warning, failed.
    value: ${{ steps.push.outputs.verdict || steps.jobs.outputs.verdict }}
  state:
    description: The verdict mapped to a commit status state (pending/success/failure).
    value: ${{ steps.jobs.outputs.state }}
  description:
    description: Single-line summary, short enough for a commit status description.
    value: ${{ steps.jobs.outputs.description }}
  ref:
    description: Try ref the push was made from.
    value: ${{ steps.push.outputs.ref }}
  revision:
    description: Try revision (top commit of the push).
    value: ${{ steps.push.outputs.revision }}
  push-id:
    description: Treeherder push id.
    value: ${{ steps.push.outputs.push-id }}
  push-url:
    description: Treeherder URL for the push.
    value: ${{ steps.push.outputs.push-url }}
  failed:
    description: Number of failed jobs.
    value: ${{ steps.jobs.outputs.failed }}
  succeeded:
    description: Number of successful jobs.
    value: ${{ steps.jobs.outputs.succeeded }}
  running:
    description: Number of pending or running jobs.
    value: ${{ steps.jobs.outputs.running }}
  blocking:
    description: Number of unclassified failures at or below max-tier.
    value: ${{ steps.jobs.outputs.blocking }}
  report:
    description: Path to a Markdown report of the push, suitable for a PR comment.
    value: ${{ steps.push.outputs.report }}
  statuses:
    description: >-
      Path to a TSV of one commit status per job, worst first, as
      priority/state/context/description/target-url.
    value: ${{ steps.jobs.outputs.statuses }}
  status-count:
    description: Number of rows in the statuses file.
    value: ${{ steps.jobs.outputs.status-count }}

runs:
  using: composite
  steps:
    # `branch` comes from a pull request and is attacker controlled, so it is
    # only ever passed through the environment, never interpolated into a
    # script, and it is checked against the characters git actually allows.
    - name: Resolve the try push
      id: push
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        TRY_REMOTE: ${{ inputs.try-remote }}
        TREEHERDER_URL: ${{ inputs.treeherder-url }}
        PROJECT: ${{ inputs.treeherder-project }}
        WAIT_FOR_PUSH: ${{ inputs.wait-for-push }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
      run: |
        set -euo pipefail

        # Treeherder rejects requests that do not identify themselves.
        UA="enterprise-try-action (+https://github.com/mozilla/enterprise-firefox)"
        # Number of user/<user>/<branch> copies of the branch we probe.
        MAX_CANDIDATES=10

        WORK="${RUNNER_TEMP:-/tmp}/enterprise-try"
        REPORT="${WORK}/report.md"
        mkdir -p "${WORK}"
        : >"${REPORT}"
        echo "report=${REPORT}" >>"${GITHUB_OUTPUT}"

        report() {
          printf '%s\n' "$*" | tee -a "${REPORT}" "${GITHUB_STEP_SUMMARY:-/dev/null}" >/dev/null
          printf '%s\n' "$*"
        }

        die() {
          echo "::error::$*"
          exit 1
        }

        # Having nothing to report is a failure: a pull request is expected to
        # have a try push under the same branch name.
        not_found() {
          echo "::error::$*"
          report "## :x: Try status: not found"
          report ""
          report "$*"
          report ""
          report "Push the branch with \`./mach try\` to get a status here."
          {
            echo "found=false"
            echo "verdict=not-found"
          } >>"${GITHUB_OUTPUT}"
          exit 1
        }

        api_get() {
          local url="$1" output="$2" attempt
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --location --max-time 60 \
                 --user-agent "${UA}" --output "${output}" "${url}"; then
              return 0
            fi
            sleep $((attempt * 5))
          done
          die "GET ${url} failed after 3 attempts"
        }

        command -v jq >/dev/null || die "jq is required"

        # git itself rejects whitespace and control characters in ref names, so
        # anything holding them did not come from a branch.
        if [[ -z "${BRANCH}" || "${BRANCH}" =~ [[:space:][:cntrl:]] ]]; then
          die "refusing to look up a branch name that git could not have produced"
        fi

        # git ls-remote matches a pattern against the tail of each ref, so a
        # bare branch name also finds the refs/heads/user/<user>/<branch>
        # copies that `mach try` pushes.
        echo "Looking for branch '${BRANCH}' in ${TRY_REMOTE}"
        git ls-remote --heads "${TRY_REMOTE}" "${BRANCH}" >"${WORK}/ls-remote" ||
          die "git ls-remote ${TRY_REMOTE} failed"
        awk -v b="${BRANCH}" '$2 ~ ("(^refs/heads/|/)" b "$") { print $1, $2 }' \
          "${WORK}/ls-remote" >"${WORK}/refs"

        refs=$(wc -l <"${WORK}/refs")
        if [[ "${refs}" -eq 0 ]]; then
          not_found "No branch named \`${BRANCH}\` in ${TRY_REMOTE}."
        fi
        echo "Found ${refs} matching ref(s):"
        if [[ "${refs}" -gt "${MAX_CANDIDATES}" ]]; then
          echo "::warning::only the first ${MAX_CANDIDATES} of ${refs} matching refs are checked"
        fi

        # Several users can hold a branch of the same name; keep the most
        # recent push among them.
        resolve_push() {
          local best="" sha ref id
          while read -r sha ref; do
            api_get "${TREEHERDER_URL}/api/project/${PROJECT}/push/?full=true&count=1&revision=${sha}" \
              "${WORK}/push.json"
            id=$(jq -r '.results[0].id // empty' "${WORK}/push.json")
            if [[ -z "${id}" ]]; then
              echo "  ${ref} -> ${sha:0:12}: no push on ${PROJECT}"
              continue
            fi
            echo "  ${ref} -> ${sha:0:12}: push ${id}"
            if [[ -z "${best}" ]] || [[ "${id}" -gt "${best}" ]]; then
              best="${id}"
              jq --arg ref "${ref}" '.results[0] + {matched_ref: $ref}' \
                "${WORK}/push.json" >"${WORK}/best.json"
            fi
          done < <(head -n "${MAX_CANDIDATES}" "${WORK}/refs")
          [[ -n "${best}" ]]
        }

        deadline=$(( $(date +%s) + WAIT_FOR_PUSH ))
        until resolve_push; do
          if [[ "$(date +%s)" -ge "${deadline}" ]]; then
            not_found "No \`${PROJECT}\` push found for branch \`${BRANCH}\`."
          fi
          echo "No push indexed on ${PROJECT} yet, retrying in ${POLL_INTERVAL}s"
          sleep "${POLL_INTERVAL}"
        done

        revision=$(jq -r '.revision' "${WORK}/best.json")
        {
          echo "found=true"
          echo "push-id=$(jq -r '.id' "${WORK}/best.json")"
          echo "revision=${revision}"
          echo "ref=$(jq -r '.branch // .matched_ref' "${WORK}/best.json")"
          echo "push-url=${TREEHERDER_URL}/jobs?repo=${PROJECT}&revision=${revision}"
        } >>"${GITHUB_OUTPUT}"

    - name: Summarize the job results
      id: jobs
      if: steps.push.outputs.found == 'true'
      shell: bash
      env:
        TREEHERDER_URL: ${{ inputs.treeherder-url }}
        MAX_TIER: ${{ inputs.max-tier }}
        PUSH_ID: ${{ steps.push.outputs.push-id }}
        PUSH_URL: ${{ steps.push.outputs.push-url }}
        REVISION: ${{ steps.push.outputs.revision }}
        TRY_REF: ${{ steps.push.outputs.ref }}
        REPORT: ${{ steps.push.outputs.report }}
      run: |
        set -euo pipefail

        UA="enterprise-try-action (+https://github.com/mozilla/enterprise-firefox)"
        MAX_JOB_PAGES=20

        WORK="${RUNNER_TEMP:-/tmp}/enterprise-try"
        mkdir -p "${WORK}"

        report() {
          printf '%s\n' "$*" | tee -a "${REPORT}" "${GITHUB_STEP_SUMMARY:-/dev/null}" >/dev/null
          printf '%s\n' "$*"
        }

        die() {
          echo "::error::$*"
          exit 1
        }

        api_get() {
          local url="$1" output="$2" attempt
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --location --max-time 60 \
                 --user-agent "${UA}" --output "${output}" "${url}"; then
              return 0
            fi
            sleep $((attempt * 5))
          done
          die "GET ${url} failed after 3 attempts"
        }

        # The jobs endpoint returns positional rows plus the property names to
        # zip them with. Flatten to TSV, following pagination.
        url="${TREEHERDER_URL}/api/jobs/?push_id=${PUSH_ID}&count=2000"
        page=0
        : >"${WORK}/jobs.tsv"
        while [[ -n "${url}" ]]; do
          if [[ "${page}" -ge "${MAX_JOB_PAGES}" ]]; then
            echo "::warning::stopped after ${MAX_JOB_PAGES} pages of jobs, counts are partial"
            break
          fi
          api_get "${url}" "${WORK}/jobs.json"
          jq -r '
            (.job_property_names // []) as $names
            | .results[]
            | [$names, .] | transpose | map({key: .[0], value: .[1]}) | from_entries
            | [ .result, .state, (.tier // 1), (.failure_classification_id // 1),
                (.task_id // ""), (.retry_id // 0),
                ((.platform // "?") + "/" + (.platform_option // "?")),
                (.job_type_name // .job_type_symbol // "?") ]
            | @tsv
          ' "${WORK}/jobs.json" >>"${WORK}/jobs.tsv"
          url=$(jq -r '.next // empty' "${WORK}/jobs.json")
          page=$((page + 1))
        done

        # Retried and superseded jobs carry no verdict for the push. A failure
        # only blocks if it is at a tier we gate on (tier 3 is not sheriffed)
        # and still untriaged, i.e. failure_classification_id 1 ("not
        # classified") or 6 ("new failure not classified"). The others (2 fixed
        # by commit, 3 expected fail, 4 intermittent, 5 infra, 7 autoclassified
        # intermittent, 8 intermittent needs bugid) have all been looked at.
        # See ${TREEHERDER_URL}/api/failureclassification/ for the full list.
        : >"${WORK}/failures.tsv"
        declare -A count=()
        while read -r key value; do
          count[${key}]=${value}
        done < <(awk -v max_tier="${MAX_TIER}" -v failures="${WORK}/failures.tsv" '
          BEGIN { FS = OFS = "\t" }
          {
            if ($2 != "completed") { running++; next }
            if ($1 == "retry" || $1 == "superseded") { retried++; next }
            if ($1 == "testfailed" || $1 == "busted" || $1 == "exception") {
              failed++
              is_blocking = ($3 + 0 <= max_tier && ($4 + 0 == 1 || $4 + 0 == 6))
              blocking += is_blocking
              flag = is_blocking ? "yes" : "no"
              print flag, $0 > failures
              next
            }
            if ($1 == "usercancel") { cancelled++; next }
            succeeded++
          }
          END {
            print "total", NR
            print "failed", failed + 0
            print "succeeded", succeeded + 0
            print "running", running + 0
            print "cancelled", cancelled + 0
            print "retried", retried + 0
            print "blocking", blocking + 0
          }
        ' "${WORK}/jobs.tsv")

        echo "Push ${PUSH_ID} has ${count[total]} job(s)"

        # One commit status per job, as prio/state/context/description/url.
        # Sorted worst first so that a cap applied by the caller keeps the rows
        # that matter. A status context must be unique, and a retriggered job
        # shows up more than once under the same name, so duplicates collapse
        # onto their worst result rather than letting a green retrigger
        # overwrite the red run it came from.
        awk -v max_tier="${MAX_TIER}" -v push_url="${PUSH_URL}" '
          BEGIN {
            FS = OFS = "\t"
            class[1] = "untriaged"
            class[2] = "fixed by commit"
            class[3] = "expected fail"
            class[4] = "intermittent"
            class[5] = "infra"
            class[6] = "new failure, untriaged"
            class[7] = "autoclassified intermittent"
            class[8] = "intermittent needs bugid"
          }
          $1 == "retry" || $1 == "superseded" { next }
          {
            result = $1; job_state = $2; tier = $3 + 0; fc = $4 + 0
            task = $5; retry = $6; platform = $7; name = $8
            note = (fc in class) ? class[fc] : ("classification " fc)
            if (job_state != "completed") {
              prio = 4; status = "pending"; desc = job_state " on " platform
            } else if (result == "success") {
              prio = 5; status = "success"; desc = "passed on " platform
            } else if (result == "usercancel") {
              prio = 3; status = "error"; desc = "cancelled on " platform
            } else if (result == "testfailed" || result == "busted" || result == "exception") {
              prio = (tier <= max_tier && (fc == 1 || fc == 6)) ? 1 : 2
              status = (result == "testfailed") ? "failure" : "error"
              desc = result " on " platform ", tier " tier ", " note
            } else {
              prio = 4; status = "pending"; desc = result " on " platform
            }
            print prio, status, "Try / " name, desc, \
              push_url "&selectedTaskRun=" task "." retry
          }
        ' "${WORK}/jobs.tsv" |
          sort -t$'\t' -k1,1n -k3,3 |
          awk -F'\t' '!seen[$3]++' >"${WORK}/statuses.tsv"

        {
          echo "statuses=${WORK}/statuses.tsv"
          echo "status-count=$(wc -l <"${WORK}/statuses.tsv")"
        } >>"${GITHUB_OUTPUT}"

        if [[ "${count[total]}" -eq 0 ]]; then
          verdict=no-jobs state=pending icon=":grey_question:"
          description="no jobs on push ${PUSH_ID} yet"
        elif [[ "${count[blocking]}" -gt 0 ]]; then
          verdict=failed state=failure icon=":x:"
          description="${count[blocking]} blocking of ${count[failed]} failure(s), ${count[total]} jobs"
          if [[ "${count[running]}" -gt 0 ]]; then
            description="${description}, ${count[running]} still running"
          fi
        elif [[ "${count[running]}" -gt 0 ]]; then
          verdict=in-progress state=pending icon=":hourglass:"
          description="${count[running]} job(s) running, ${count[failed]} failed, ${count[succeeded]} passed"
        elif [[ $(( count[failed] + count[cancelled] )) -gt 0 ]]; then
          verdict=warning state=success icon=":warning:"
          description="${count[failed]} non-blocking failure(s), ${count[cancelled]} cancelled, ${count[total]} jobs"
        else
          verdict=success state=success icon=":white_check_mark:"
          description="${count[succeeded]} job(s) succeeded"
        fi

        report "## ${icon} Try status: ${verdict}"
        report ""
        report "[Push ${PUSH_ID}](${PUSH_URL}) &mdash; \`${TRY_REF}\` at \`${REVISION:0:12}\`"
        report ""
        report "| Failed | Succeeded | Running | Cancelled | Retried |"
        report "| --- | --- | --- | --- | --- |"
        report "| ${count[failed]} | ${count[succeeded]} | ${count[running]} | ${count[cancelled]} | ${count[retried]} |"

        if [[ "${count[failed]}" -gt 0 ]]; then
          report ""
          report "### Failures"
          report ""
          report "A failure blocks when it is up to tier ${MAX_TIER} and still untriaged."
          report "The others were classified as intermittent, infra, expected, or fixed by"
          report "another commit, or run at a tier that is not sheriffed."
          report ""
          report "| Job | Platform | Result | Tier | Blocking |"
          report "| --- | --- | --- | --- | --- |"
          while IFS=$'\t' read -r blocking result _ tier _ task_id retry_id platform name; do
            report "| [${name}](${PUSH_URL}&selectedTaskRun=${task_id}.${retry_id}) | ${platform} | ${result} | ${tier} | ${blocking} |"
            if [[ "${blocking}" == "yes" ]]; then
              echo "::warning title=Try failure::${name} on ${platform} [${result}]"
            fi
          done <"${WORK}/failures.tsv"
        fi

        {
          echo "verdict=${verdict}"
          echo "state=${state}"
          echo "description=${description}"
          echo "failed=${count[failed]}"
          echo "succeeded=${count[succeeded]}"
          echo "running=${count[running]}"
          echo "blocking=${count[blocking]}"
        } >>"${GITHUB_OUTPUT}"
